<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
</head>
<body>
  <main>
    <h1>Weather App</h1>

    <form id="weather-form">
      <label for="location">Location</label>
      <input
        type="text"
        id="location"
        name="location"
        placeholder="Enter a city"
        required
      >
      <button type="submit">Search</button>
    </form>
    <button id="unit-toggle" type="button">Switch to °F</button>
    <p id="weather-error" role="alert"></p>
    <section id="weather-results" aria-live="polite"></section>
  </main>
</body>
</html>
